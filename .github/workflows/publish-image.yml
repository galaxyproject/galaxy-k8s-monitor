name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes and serialize publishing so builds do not compete for latest.
concurrency:
  group: publish-image
  cancel-in-progress: false
  queue: max

env:
  IMAGE: afgane/galaxy-k8s-monitor

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: gcp-runner
    timeout-minutes: 30
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=monitor-image
          cache-to: type=gha,mode=max,scope=monitor-image
